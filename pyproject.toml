[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-obsidian-engine"
version = "0.1.0"
description = "Deterministic local-first engine for the copilot-obsidian plugin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Mark Garner" },
]
keywords = [
  "copilot",
  "knowledge-base",
  "local-first",
  "obsidian",
  "wiki",
]
dependencies = []

[project.urls]
Repository = "https://github.com/markgar/copilot-obsidian-meeting-notes"

[tool.setuptools.packages.find]
include = ["copilot_obsidian_engine*"]
